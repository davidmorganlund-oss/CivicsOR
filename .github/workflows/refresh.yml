name: Refresh and publish

on:
  schedule:
    - cron: "17 11 * * *"   # nightly, about 3:17 or 4:17 a.m. Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md", "OPERATIONS.md", "tools/**", ".github/workflows/discover.yml", ".github/workflows/trial.yml"]

# Each job gets only what it needs (below); nothing by default.
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # save the refreshed data
      issues: write     # open and close the upkeep issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # needed to push the refreshed data
          ref: main   # the latest main, not the commit that triggered a queued run
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Build the calendar data
        shell: bash   # with pipefail, so a crash shows up instead of hiding behind tee
        run: python pipeline/build.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Build the representatives roster
        shell: bash   # with pipefail, so a crash shows up instead of hiding behind tee
        run: python pipeline/officials.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Flag calendars that keep failing
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/alerts.py
      - name: Save the refreshed data
        if: always()
        run: |
          git config user.name "civicsor-bot"
          git config user.email "civicsor-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh calendar data"
          # If another run saved data meanwhile, keep this run's fresher data.
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
