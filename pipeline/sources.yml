        location: Public Services Building, Room 120D, 155 N. First Ave., Hillsboro (and online)
        category: council
        url: https://www.washingtoncountyor.gov/bcc/resources/board-meeting-schedule
        note: Agendas post three business days before.
      - title: Board of Commissioners regular business meeting
        when: 1st, 3rd Tuesday
        location: Public Services Building, 155 N. First Ave., Hillsboro (and online)
        category: council
        url: https://www.washingtoncountyor.gov/bcc

  - id: hillsboro
