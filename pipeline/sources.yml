  # ---------- School boards and education service districts on BoardBook ----------
  # Each board posts its meetings and agendas on its own BoardBook page (confirmed
  # by a trial run, November 2026). Closed executive sessions are left out.
  # Boards usually post a meeting about a week ahead, so the largest districts
  # also carry the dates they publish for the year (regular_schedule), which
  # show as "Usually meets" until the board posts that day's meeting.
